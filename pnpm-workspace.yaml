packages:
  - "."

allowBuilds:
  esbuild: true
  "@parcel/watcher": true

overrides:
  astro: "^7.3.8"
  tar: "^7.5.21"
  svgo: "^4.1.0"
  undici: "^7.29.1"
  postcss: "^8.5.23"
  nanoid: "^3.3.17"
  sharp: "^0.35.5"
  immutable: "^5.1.8"
  fast-uri: "^3.1.5"
  js-yaml: "^4.3.2"
  deepmerge-ts: "^8.0.2"
  source-map-js: "^1.2.2"
  http-cache-semantics: "^4.3.0"
  "@iconify/tools": "^5.0.14"
  "picomatch@2": "2.3.2"
  "picomatch@4": "4.0.4"

onlyBuiltDependencies:
  - esbuild
  - "@parcel/watcher"

minimumReleaseAgeExclude:
  - astro-smart-links@1.1.1
  - astro@7.3.8

auditConfig:
  # No patched release exists yet (npm latest is braces@3.0.3 while the
  # advisory asks for >=3.0.4). Drop this entry once a fix is published.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
